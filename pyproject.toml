[project]
name = "mirrordesk-web-feasibility"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiortc==1.14.0",
    "aiohttp==3.13.3",
    "av==16.1.0",
    "numpy==2.3.5",
    # Windows notification-area (tray) icon for background mode; not needed in Docker/Linux.
    "pystray==0.19.5 ; sys_platform == 'win32'",
    "pillow==12.3.0 ; sys_platform == 'win32'",
    "pyusb==1.3.1",
    "cryptography==50.0.1",
    "segno==1.6.6",
]
[dependency-groups]
dev = [
    "playwright==1.64.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["e2e: Playwright UI tests against a live server (tests/e2e; run with -m e2e)",
           "browsers(*names): restrict an e2e test to these browser engines"]
addopts = "-m 'not e2e'"
