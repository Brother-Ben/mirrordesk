# Builds the MirrorDesk image for Linux hosts (x86-64 and ARM64) and publishes it on GitHub's
# container registry as ghcr.io/<owner>/mirrordesk:<version> and :latest when a version tag
# (v0.13.0, ...) is pushed. The Docker Compose / Dockge files in docker/ name that image, so
# pasting one of them into Dockge downloads MirrorDesk by itself.
name: Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The tag matches MirrorDesk's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" mirrordesk/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but mirrordesk/__init__.py says $version"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mirrordesk
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
