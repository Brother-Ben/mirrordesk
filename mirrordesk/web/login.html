<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0f12">
<title>Sign in · MirrorDesk</title>
<link rel="icon" href="/app/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app/app.css">
<script src="/app/theme.js"></script>
</head>
<body>
<div class="login-page">
  <main class="login">
    <div class="brand"><img src="/app/icon.svg" alt="" width="28" height="28"><span>MirrorDesk</span></div>
    <div>
      <h1 id="login-title">Enter your code</h1>
      <p id="login-hint">Ask the person running MirrorDesk for the viewer code.</p>
    </div>
    <form id="login-form">
      <label for="code" class="sr">Code</label>
      <input id="code" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="32" required autofocus>
      <button type="submit" class="btn primary">Sign in</button>
      <p id="login-msg" role="alert"></p>
    </form>
    <p class="back" id="login-back" hidden><a href="/">Back to the screen</a></p>
  </main>
</div>
<script src="/app/login.js"></script>
</body>
</html>
